# Builds VIVA and deploys it to GitHub Pages.
# (VIVA is a Vite app: it must be built — the raw repository can't be served directly.)
name: Deploy VIVA to Pages

on:
  push:
    branches: ["claude/nifty-mendel-o5cfbd", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      # Public URL of the account API (not a secret). Comes from .env.production in the repo, or the
      # LWD_API_URL repository variable when set. With neither, the app builds local-only (no accounts).
      - name: Use the API URL from the repository variable, if set
        if: vars.LWD_API_URL != ''
        run: echo "VITE_LWD_API_URL=${{ vars.LWD_API_URL }}" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
